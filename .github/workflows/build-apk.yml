name: Build Bus Tracker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/BusTracker.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusTracker-APK
          path: output/BusTracker.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Bus Tracker v1.0.0 (APK)
          body: |
            ### Bus Tracker Android App
            Download and install `BusTracker.apk` directly on your Android phone.

            - **Driver View**: Live GPS sharing with geofencing.
            - **Student View**: Live bus location and route tracking powered by Google Maps.
          files: output/BusTracker.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
